# SLO recording rules for orders-service.
#   Availability SLO: 99.5% of /api requests do not return 5xx   (30-day window)
#   Latency SLO:      99% of /api requests complete within 300ms (30-day window)
groups:
  - name: slo.objectives
    rules:
      - record: slo:objective:ratio
        expr: vector(0.995)
        labels: {slo: availability}
      - record: slo:objective:ratio
        expr: vector(0.99)
        labels: {slo: latency}

  - name: slo.availability
    interval: 30s
    rules:
      - record: slo:sli_error:ratio_rate5m
        labels: {slo: availability}
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*", status=~"5.."}[5m]))
          /
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[5m]))
      - record: slo:sli_error:ratio_rate30m
        labels: {slo: availability}
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*", status=~"5.."}[30m]))
          /
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[30m]))
      - record: slo:sli_error:ratio_rate1h
        labels: {slo: availability}
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*", status=~"5.."}[1h]))
          /
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[1h]))
      - record: slo:sli_error:ratio_rate2h
        labels: {slo: availability}
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*", status=~"5.."}[2h]))
          /
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[2h]))
      - record: slo:sli_error:ratio_rate6h
        labels: {slo: availability}
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*", status=~"5.."}[6h]))
          /
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[6h]))
      - record: slo:sli_error:ratio_rate1d
        labels: {slo: availability}
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*", status=~"5.."}[1d]))
          /
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[1d]))
      - record: slo:sli_error:ratio_rate3d
        labels: {slo: availability}
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*", status=~"5.."}[3d]))
          /
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[3d]))
      - record: slo:sli_error:ratio_rate30d
        labels: {slo: availability}
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*", status=~"5.."}[30d]))
          /
          sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[30d]))

  - name: slo.latency
    interval: 30s
    rules:
      - record: slo:sli_error:ratio_rate5m
        labels: {slo: latency}
        expr: |
          1 - (
            sum by (job) (rate(http_server_requests_seconds_bucket{job="orders-service", uri=~"/api/.*", le="0.3"}[5m]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[5m]))
          )
      - record: slo:sli_error:ratio_rate30m
        labels: {slo: latency}
        expr: |
          1 - (
            sum by (job) (rate(http_server_requests_seconds_bucket{job="orders-service", uri=~"/api/.*", le="0.3"}[30m]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[30m]))
          )
      - record: slo:sli_error:ratio_rate1h
        labels: {slo: latency}
        expr: |
          1 - (
            sum by (job) (rate(http_server_requests_seconds_bucket{job="orders-service", uri=~"/api/.*", le="0.3"}[1h]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[1h]))
          )
      - record: slo:sli_error:ratio_rate2h
        labels: {slo: latency}
        expr: |
          1 - (
            sum by (job) (rate(http_server_requests_seconds_bucket{job="orders-service", uri=~"/api/.*", le="0.3"}[2h]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[2h]))
          )
      - record: slo:sli_error:ratio_rate6h
        labels: {slo: latency}
        expr: |
          1 - (
            sum by (job) (rate(http_server_requests_seconds_bucket{job="orders-service", uri=~"/api/.*", le="0.3"}[6h]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[6h]))
          )
      - record: slo:sli_error:ratio_rate1d
        labels: {slo: latency}
        expr: |
          1 - (
            sum by (job) (rate(http_server_requests_seconds_bucket{job="orders-service", uri=~"/api/.*", le="0.3"}[1d]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[1d]))
          )
      - record: slo:sli_error:ratio_rate3d
        labels: {slo: latency}
        expr: |
          1 - (
            sum by (job) (rate(http_server_requests_seconds_bucket{job="orders-service", uri=~"/api/.*", le="0.3"}[3d]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[3d]))
          )
      - record: slo:sli_error:ratio_rate30d
        labels: {slo: latency}
        expr: |
          1 - (
            sum by (job) (rate(http_server_requests_seconds_bucket{job="orders-service", uri=~"/api/.*", le="0.3"}[30d]))
            /
            sum by (job) (rate(http_server_requests_seconds_count{job="orders-service", uri=~"/api/.*"}[30d]))
          )

  - name: slo.error_budget
    interval: 1m
    rules:
      # 1 = full budget left, 0 = budget exhausted, negative = SLO breached
      - record: slo:error_budget_remaining:ratio
        expr: |
          1 - (
            slo:sli_error:ratio_rate30d
            / on (slo) group_left()
            (1 - slo:objective:ratio)
          )
      # How fast the budget is being spent (1 = exactly on budget)
      - record: slo:burn_rate:ratio_rate1h
        expr: slo:sli_error:ratio_rate1h / on (slo) group_left() (1 - slo:objective:ratio)
      - record: slo:burn_rate:ratio_rate6h
        expr: slo:sli_error:ratio_rate6h / on (slo) group_left() (1 - slo:objective:ratio)
