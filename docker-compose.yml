# Spring Boot service + SLO monitoring
# Usage: docker compose up -d --build
name: spring-boot-slo

services:
  orders-service:
    build: ./app
    container_name: orders-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  # Steady synthetic traffic so the SLO numbers are always meaningful
  loadgen:
    image: grafana/k6:1.0.0
    container_name: loadgen
    restart: unless-stopped
    command: run /scripts/traffic.js
    environment:
      BASE_URL: http://orders-service:8080
      RPS: ${LOAD_RPS:-10}
    volumes:
      - ./loadtest:/scripts:ro
    depends_on:
      orders-service:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.4.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=35d   # must cover the 30-day SLO window
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:12.0.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/slo-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]

volumes:
  prometheus_data:
  grafana_data:
